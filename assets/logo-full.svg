<!-- Full logo: canonical pin mark + logotype, locked up horizontally.
     Use this for App Store listings, social profile pictures, partnership decks,
     press kit. The marketing-site nav embeds the SVG inline (see index.html
     header) for finer control over hover state + period accent color.

     Color strategy: ink elements use currentColor so the lockup adapts to its
     host (dark on cream, white on dark, etc.). The pin's inner knockout uses a
     fixed cream so it reads on any background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" aria-labelledby="logo-full-title">
  <title id="logo-full-title">Real Product Origin</title>

  <!-- Canonical pin mark — same path as logo-mark.svg (just the pin portion,
       no map + route), positioned at left-of-lockup. Source pin viewBox is
       60×80; here we render it 90×120 (scale 1.5×) so it matches the wordmark
       cap height visually. -->
  <g transform="translate(0, 20)">
    <path d="M 45 0 C 18 0, 0 21, 0 42 C 0 78, 45 120, 45 120 C 45 120, 90 78, 90 42 C 90 21, 72 0, 45 0 Z"
          fill="currentColor"/>
    <circle cx="45" cy="42" r="13.5" fill="#faf6ed"/>
  </g>

  <!-- Wordmark: "Real Product Origin" in Inter 800 with tight tracking, then
       a brand-red accent period that echoes the pin head — gives the brand a
       subtle "stamped / signed" quality.

       We render as <text> rather than paths because editing wordmark text in
       SVG-as-paths is fragile; the locked-up paths-version can be exported
       separately when needed for true print work.
  -->
  <text x="124" y="98"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="56"
        font-weight="800"
        letter-spacing="-1.5"
        fill="currentColor"><tspan>Real Product Origin</tspan><tspan fill="#ef4444">.</tspan></text>
</svg>
